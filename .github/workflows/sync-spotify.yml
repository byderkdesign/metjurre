name: Spotify naar Webflow

on:
  schedule:
    - cron: '0 6 * * *' # elke dag om 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Alleen tonen wat er zou gebeuren'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-spotify.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
          SPOTIFY_SHOW_ID: 2i8HAziYwroCJqkUB1dsvG
          WEBFLOW_COLLECTION_ID: 680921a92a62c6ae6069f34c
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
